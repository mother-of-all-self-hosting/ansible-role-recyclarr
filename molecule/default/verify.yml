---
- name: Verify Recyclarr
  hosts: all
  become: true
  gather_facts: false

  vars:
    # These are role defaults, but Jinja-derived ones, and a verify play cannot
    # resolve them out of defaults/main.yml - so they are spelled out here.
    recyclarr_verify_base_path: /recyclarr
    recyclarr_verify_data_path: /recyclarr/data

    recyclarr_verify_sonarr_headers:
      X-Api-Key: "{{ recyclarr_molecule_sonarr_api_key }}"

    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    recyclarr_verify_uid: 1873
    recyclarr_verify_gid: 1873
    recyclarr_verify_timezone: Asia/Tokyo
    recyclarr_verify_timezone_abbreviation: JST
    recyclarr_verify_cron_schedule: "* * * * *"

    recyclarr_verify_units:
      - sonarr.service
      - recyclarr.service

  tasks:
    - name: Verify that Recyclarr works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertions
        # below to the version the role really pins.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: recyclarr_defaults

        # ------------------------------------------------------------------
        # The systemd unit
        # ------------------------------------------------------------------

        - name: Wait for the Recyclarr systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: recyclarr_services
          until: recyclarr_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ recyclarr_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Recyclarr systemd services are active
          ansible.builtin.assert:
            that: recyclarr_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(recyclarr_verify_units | zip(recyclarr_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Recyclarr systemd services log for debugging
          when: recyclarr_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ recyclarr_verify_units }}"

        # ------------------------------------------------------------------
        # What `docker create` was actually told
        # ------------------------------------------------------------------

        - name: Inspect Recyclarr container
          ansible.builtin.command:
            cmd: docker container inspect recyclarr
          register: recyclarr_container_raw
          changed_when: false

        - name: Parse the Recyclarr container definition
          ansible.builtin.set_fact:
            recyclarr_container: "{{ (recyclarr_container_raw.stdout | from_json)[0] }}"

        - name: Assert that the data path and the rendered configuration file are mounted where Recyclarr reads them
          ansible.builtin.assert:
            that:
              - recyclarr_mounts['/config'].Source == recyclarr_verify_data_path
              - recyclarr_mounts['/config'].RW
              - recyclarr_mounts['/config/recyclarr.yml'].Source == recyclarr_verify_base_path ~ '/recyclarr.yml'
              - not recyclarr_mounts['/config/recyclarr.yml'].RW
            fail_msg: "The container's mounts are not what the role should have produced: {{ recyclarr_container.Mounts }}"
            success_msg: "The data path is mounted at /config and the configuration file read-only over /config/recyclarr.yml"
          vars:
            recyclarr_mounts: "{{ dict(recyclarr_container.Mounts | map(attribute='Destination') | zip(recyclarr_container.Mounts)) }}"

        - name: Assert that the read-only container still gets its writable /tmp
          ansible.builtin.assert:
            that:
              - recyclarr_container.HostConfig.ReadonlyRootfs
              - "'/tmp' in (recyclarr_container.HostConfig.Tmpfs | default({}))"
            fail_msg: >-
              The container's root filesystem is
              {{ 'read-only' if recyclarr_container.HostConfig.ReadonlyRootfs else 'writable' }}
              and its tmpfs mounts are {{ recyclarr_container.HostConfig.Tmpfs | default({}) }}
            success_msg: "The container is read-only with a tmpfs at /tmp"

        - name: Assert that the role's user, timezone and schedule reached the container
          ansible.builtin.assert:
            that:
              - recyclarr_container.Config.User == (recyclarr_verify_uid | string) ~ ':' ~ (recyclarr_verify_gid | string)
              - ('TZ=' ~ recyclarr_verify_timezone) in recyclarr_container.Config.Env
              - ('CRON_SCHEDULE=' ~ recyclarr_verify_cron_schedule) in recyclarr_container.Config.Env
            fail_msg: >-
              The container runs as {{ recyclarr_container.Config.User }}
              with {{ recyclarr_container.Config.Env | select('match', '(TZ|CRON_SCHEDULE)=') | list }}
            success_msg: "The container runs as {{ recyclarr_container.Config.User }} with the role's TZ and CRON_SCHEDULE"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that:
              - recyclarr_container.Config.Image == 'ghcr.io/recyclarr/recyclarr:' ~ recyclarr_defaults.recyclarr_version
              - recyclarr_container.Config.Labels['org.opencontainers.image.version'] == recyclarr_defaults.recyclarr_version
            fail_msg: >-
              The container runs {{ recyclarr_container.Config.Image }}
              ({{ recyclarr_container.Config.Labels['org.opencontainers.image.version'] | default('no version label') }}),
              not the {{ recyclarr_defaults.recyclarr_version }} pinned in defaults/main.yml
            success_msg: "The container runs {{ recyclarr_container.Config.Image }}"

        - name: Assert that the container is connected to the Sonarr network
          ansible.builtin.assert:
            that: recyclarr_molecule_sonarr_network in recyclarr_container.NetworkSettings.Networks
            fail_msg: "The container is connected to {{ recyclarr_container.NetworkSettings.Networks.keys() | list }} only"
            success_msg: "The container is connected to {{ recyclarr_container.NetworkSettings.Networks.keys() | list | join(', ') }}"

        # ------------------------------------------------------------------
        # The configuration file the role renders
        # ------------------------------------------------------------------

        - name: Read the rendered Recyclarr configuration
          ansible.builtin.slurp:
            src: "{{ recyclarr_verify_base_path }}/recyclarr.yml"
          register: recyclarr_rendered_configuration_raw

        - name: Look up the rendered Recyclarr configuration file
          ansible.builtin.stat:
            path: "{{ recyclarr_verify_base_path }}/recyclarr.yml"
          register: recyclarr_rendered_configuration_stat

        # It holds the API keys, so it must not be readable by everyone.
        - name: Assert that the rendered configuration merges the extension into the instance and is not world-readable
          ansible.builtin.assert:
            that:
              - recyclarr_rendered_configuration.sonarr.main.api_key == recyclarr_molecule_sonarr_api_key
              - recyclarr_rendered_configuration.sonarr.main.custom_formats[0].trash_ids == [recyclarr_molecule_custom_format_trash_id]
              - recyclarr_rendered_configuration.sonarr.main.media_naming.season == 'default'
              - recyclarr_rendered_configuration.radarr == {}
              - recyclarr_rendered_configuration_stat.stat.mode == '0640'
              - recyclarr_rendered_configuration_stat.stat.uid == recyclarr_verify_uid
            fail_msg: >-
              The rendered configuration is {{ recyclarr_rendered_configuration }},
              with mode {{ recyclarr_rendered_configuration_stat.stat.mode }} and owner {{ recyclarr_rendered_configuration_stat.stat.uid }}
            success_msg: "The rendered configuration carries the instance with the extension merged in, readable by its owner only"
          vars:
            recyclarr_rendered_configuration: "{{ recyclarr_rendered_configuration_raw.content | b64decode | from_yaml }}"

        # ------------------------------------------------------------------
        # What the process inside the container actually sees and does
        # ------------------------------------------------------------------

        - name: Ask the Recyclarr container which timezone and user it is running in
          ansible.builtin.command:
            cmd: docker exec recyclarr sh -c 'date +%Z; id -u; id -g'
          register: recyclarr_process_identity
          changed_when: false

        - name: Assert that the Recyclarr process runs in the role's timezone, as the role's user
          ansible.builtin.assert:
            that:
              - recyclarr_process_identity.stdout_lines[0] == recyclarr_verify_timezone_abbreviation
              - recyclarr_process_identity.stdout_lines[1] == recyclarr_verify_uid | string
              - recyclarr_process_identity.stdout_lines[2] == recyclarr_verify_gid | string
            fail_msg: >-
              The container reports zone/uid/gid {{ recyclarr_process_identity.stdout_lines }},
              expected [{{ recyclarr_verify_timezone_abbreviation }},
              {{ recyclarr_verify_uid }}, {{ recyclarr_verify_gid }}]
            success_msg: >-
              The Recyclarr process runs in {{ recyclarr_process_identity.stdout_lines[0] }}
              as {{ recyclarr_process_identity.stdout_lines[1] }}:{{ recyclarr_process_identity.stdout_lines[2] }}

        # An instance reused across runs keeps what an earlier sync set in Sonarr, so
        # both are taken back to what a fresh Sonarr has before the sync is waited
        # for. Whatever turns up afterwards can only come from this run.
        - name: Look up Sonarr's custom formats and naming before the sync (up to 120s)
          ansible.builtin.uri:
            url: "{{ recyclarr_molecule_sonarr_url }}/api/v3/{{ item }}"
            headers: "{{ recyclarr_verify_sonarr_headers }}"
          register: recyclarr_sonarr_before
          until: recyclarr_sonarr_before.status == 200
          retries: 24
          delay: 5
          loop:
            - customformat
            - config/naming

        - name: Remove the custom format from Sonarr
          ansible.builtin.uri:
            url: "{{ recyclarr_molecule_sonarr_url }}/api/v3/customformat/{{ item.id }}"
            method: DELETE
            headers: "{{ recyclarr_verify_sonarr_headers }}"
          loop: "{{ recyclarr_sonarr_before.results[0].json | selectattr('name', 'equalto', recyclarr_molecule_custom_format_name) | list }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Put back Sonarr's own season folder format
          ansible.builtin.uri:
            url: "{{ recyclarr_molecule_sonarr_url }}/api/v3/config/naming/{{ recyclarr_sonarr_before.results[1].json.id }}"
            method: PUT
            headers: "{{ recyclarr_verify_sonarr_headers }}"
            body: "{{ recyclarr_sonarr_before.results[1].json | combine({'seasonFolderFormat': recyclarr_molecule_season_folder_format_stock}) }}"
            body_format: json
            status_code: [200, 202]

        # Recyclarr does not sync on start, only on its schedule, so the custom format
        # turning up in Sonarr again means the scheduled sync ran, read the rendered
        # configuration, reached Sonarr over the additional network, and could write
        # its copy of the TRaSH Guides to the data path.
        - name: Wait for the scheduled sync to create the custom format in Sonarr (up to 300s)
          ansible.builtin.uri:
            url: "{{ recyclarr_molecule_sonarr_url }}/api/v3/customformat"
            headers: "{{ recyclarr_verify_sonarr_headers }}"
          register: recyclarr_sonarr_custom_formats
          until: recyclarr_molecule_custom_format_name in (recyclarr_sonarr_custom_formats.json | default([]) | map(attribute='name') | list)
          retries: 60
          delay: 5
          failed_when: false

        # The sync sets the media naming after the custom formats, so it may not
        # have got there yet.
        - name: Wait for the same sync to set the season folder format in Sonarr (up to 60s)
          ansible.builtin.uri:
            url: "{{ recyclarr_molecule_sonarr_url }}/api/v3/config/naming"
            headers: "{{ recyclarr_verify_sonarr_headers }}"
          register: recyclarr_sonarr_naming
          until: (recyclarr_sonarr_naming.json | default({})).get('seasonFolderFormat') == recyclarr_molecule_season_folder_format_guide
          retries: 12
          delay: 5
          failed_when: false

        - name: Assert the sync applied both the instance and its extension to Sonarr
          ansible.builtin.assert:
            that:
              - recyclarr_molecule_custom_format_name in (recyclarr_sonarr_custom_formats.json | default([]) | map(attribute='name') | list)
              - (recyclarr_sonarr_naming.json | default({})).get('seasonFolderFormat') == recyclarr_molecule_season_folder_format_guide
            fail_msg: >-
              Sonarr has the custom formats {{ recyclarr_sonarr_custom_formats.json | default([]) | map(attribute='name') | list }}
              and the season folder format {{ (recyclarr_sonarr_naming.json | default({})).get('seasonFolderFormat') }}
            success_msg: >-
              The scheduled sync created {{ recyclarr_molecule_custom_format_name }} in Sonarr
              and set its season folder format to {{ recyclarr_sonarr_naming.json.seasonFolderFormat }}

        - name: Look up Recyclarr's state under the role's data path
          ansible.builtin.stat:
            path: "{{ recyclarr_verify_data_path }}/state"
          register: recyclarr_state

        - name: Assert Recyclarr keeps its state under the role's data path, as the role's user
          ansible.builtin.assert:
            that:
              - recyclarr_state.stat.isdir | default(false)
              - recyclarr_state.stat.uid == recyclarr_verify_uid
            fail_msg: "{{ recyclarr_verify_data_path }}/state is {{ recyclarr_state.stat }}"
            success_msg: "{{ recyclarr_verify_data_path }}/state exists and belongs to {{ recyclarr_verify_uid }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "recyclarr_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: recyclarr_restarts_before
              loop: "{{ recyclarr_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window. It also spans a scheduled sync.
            - name: Watch the services for 75 seconds
              ansible.builtin.pause:
                seconds: 75

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: recyclarr_restarts_after
              loop: "{{ recyclarr_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - recyclarr_restarts_after.results | map(attribute='status.NRestarts') | list == recyclarr_restarts_before.results | map(attribute='status.NRestarts') | list
                  - recyclarr_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in recyclarr_verify_units | zip(recyclarr_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in recyclarr_verify_units | zip(recyclarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 75 seconds of watching (restarts so far:
                  {% for unit, restarts in recyclarr_verify_units | zip(recyclarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Recyclarr verification summary
          ansible.builtin.debug:
            msg:
              - "Recyclarr systemd: {% for unit, state in recyclarr_verify_units | zip(recyclarr_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Recyclarr image: {{ recyclarr_container.Config.Image }}"
              - "Sonarr custom formats: {{ recyclarr_sonarr_custom_formats.json | map(attribute='name') | list | join(', ') }}"
              - "Sonarr season folder format: {{ recyclarr_sonarr_naming.json.seasonFolderFormat }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service logs.
        - name: Retrieve the systemd service logs
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          register: recyclarr_service_logs
          changed_when: false
          loop: "{{ recyclarr_verify_units }}"

        - name: Show the systemd service logs
          ansible.builtin.debug:
            msg: "{{ item.stdout_lines }}"
          loop: "{{ recyclarr_service_logs.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Verification failed. The systemd service logs are printed above."
