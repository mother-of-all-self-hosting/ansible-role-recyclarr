---
# Project source code URL: https://github.com/recyclarr/recyclarr

recyclarr_enabled: true

recyclarr_identifier: recyclarr
recyclarr_base_path: "/{{ recyclarr_identifier }}"

# The directory mounted into the container at `/config`.
#
# Recyclarr keeps its state, its logs and its copy of the TRaSH Guides there.
# The configuration file the role renders (see `recyclarr_configuration`) is mounted
# over `/config/recyclarr.yml` read-only.
recyclarr_data_path: "{{ recyclarr_base_path }}/data"

# renovate: datasource=docker depName=ghcr.io/recyclarr/recyclarr versioning=semver
recyclarr_version: 8.8.1

recyclarr_uid: ""
recyclarr_gid: ""

recyclarr_container_image: "{{ recyclarr_container_image_registry_prefix }}recyclarr/recyclarr:{{ recyclarr_container_image_tag }}"
recyclarr_container_image_tag: "{{ recyclarr_version }}"
recyclarr_container_image_registry_prefix: "{{ recyclarr_container_image_registry_prefix_upstream }}"
recyclarr_container_image_registry_prefix_upstream: "{{ recyclarr_container_image_registry_prefix_upstream_default }}"
recyclarr_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
recyclarr_container_network: "{{ recyclarr_identifier }}"

# Control if the container network is deleted on uninstalling.
recyclarr_container_network_deletion_enabled: true

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to let Recyclarr reach Sonarr and Radarr, which run in a different container network.
recyclarr_container_additional_networks: "{{ (recyclarr_container_additional_networks_default + recyclarr_container_additional_networks_auto + recyclarr_container_additional_networks_custom) | unique }}"
recyclarr_container_additional_networks_default: []
recyclarr_container_additional_networks_auto: []
recyclarr_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
recyclarr_container_additional_volumes: "{{ recyclarr_container_additional_volumes_auto + recyclarr_container_additional_volumes_custom }}"
recyclarr_container_additional_volumes_auto: []
recyclarr_container_additional_volumes_custom: []

# Specify the size of the container's tmpfs volume (/tmp)
recyclarr_container_tmpfs_tmp_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
recyclarr_container_extra_arguments: "{{ recyclarr_container_extra_arguments_auto + recyclarr_container_extra_arguments_custom }}"
recyclarr_container_extra_arguments_auto: []
recyclarr_container_extra_arguments_custom: []

# List of systemd services that the Recyclarr systemd service depends on
recyclarr_systemd_required_services_list: "{{ (recyclarr_systemd_required_services_list_default + recyclarr_systemd_required_services_list_auto + recyclarr_systemd_required_services_list_custom) | unique }}"
recyclarr_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
recyclarr_systemd_required_services_list_auto: []
recyclarr_systemd_required_services_list_custom: []

# List of systemd services that the Recyclarr systemd service wants
recyclarr_systemd_wanted_services_list: "{{ (recyclarr_systemd_wanted_services_list_default + recyclarr_systemd_wanted_services_list_auto + recyclarr_systemd_wanted_services_list_custom) | unique }}"
recyclarr_systemd_wanted_services_list_default: []
recyclarr_systemd_wanted_services_list_auto: []
recyclarr_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
recyclarr_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
recyclarr_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
recyclarr_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
recyclarr_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ recyclarr_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ recyclarr_container_stop_grace_time_seconds }} {{ recyclarr_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ recyclarr_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ recyclarr_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ recyclarr_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ recyclarr_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ recyclarr_identifier }} after {{ recyclarr_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# The Sonarr instances to sync, as Recyclarr's `sonarr` section, keyed by a name for each instance.
# Each name (ignoring case) and `base_url` must be unique across both `recyclarr_config_sonarr` and `recyclarr_config_radarr`.
# See: https://recyclarr.dev/reference/configuration/
#
# Example:
# recyclarr_config_sonarr:
#   sonarr:
#     base_url: http://sonarr:8989
#     api_key: YOUR_SONARR_API_KEY_HERE
#     quality_definition:
#       type: series
recyclarr_config_sonarr: {}

# The Radarr instances to sync, as Recyclarr's `radarr` section, keyed by a name for each instance.
# Each name (ignoring case) and `base_url` must be unique across both `recyclarr_config_sonarr` and `recyclarr_config_radarr`.
# See: https://recyclarr.dev/reference/configuration/
#
# Example:
# recyclarr_config_radarr:
#   radarr:
#     base_url: http://radarr:7878
#     api_key: YOUR_RADARR_API_KEY_HERE
#     quality_definition:
#       type: movie
recyclarr_config_radarr: {}

# Default Recyclarr configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `recyclarr_configuration_extension_yaml`)
# or completely replace this variable with your own template.
recyclarr_configuration_yaml: "{{ lookup('template', 'templates/recyclarr.yml.j2') }}"

recyclarr_configuration_extension_yaml: |
  # Your custom YAML configuration for Recyclarr goes here.
  # This configuration extends the default starting configuration (`recyclarr_configuration_yaml`).
  #
  # You can override individual variables from the default configuration, or introduce new ones.
  #
  # If you need something more special, you can take full control by
  # completely redefining `recyclarr_configuration_yaml`.

recyclarr_configuration_extension: "{{ recyclarr_configuration_extension_yaml | from_yaml if recyclarr_configuration_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final Recyclarr configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `recyclarr_configuration_yaml`.
recyclarr_configuration: "{{ recyclarr_configuration_yaml | from_yaml | combine(recyclarr_configuration_extension, recursive=True) }}"

# Specify the timezone
recyclarr_environment_variables_tz: "Etc/UTC"

# The schedule Recyclarr syncs on, as a cron expression (e.g. `0 4 * * *`) or a shortcut such as `@daily`.
recyclarr_environment_variables_cron_schedule: "@daily"

# Additional environment variables.
recyclarr_environment_variables_additional_variables: ""

# recyclarr_restart_necessary controls whether the Recyclarr systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
recyclarr_restart_necessary: false
