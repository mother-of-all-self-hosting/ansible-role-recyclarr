---
- name: Ensure Recyclarr paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ recyclarr_uid }}"
    group: "{{ recyclarr_gid }}"
  with_items:
    - "{{ recyclarr_base_path }}"
    - "{{ recyclarr_data_path }}"

- name: Ensure Recyclarr support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ recyclarr_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ recyclarr_uid }}"
    group: "{{ recyclarr_gid }}"
  with_items:
    - env
  register: recyclarr_support_files_result

- name: Ensure Recyclarr configuration installed
  ansible.builtin.copy:
    content: "{{ recyclarr_configuration | to_nice_yaml(indent=2, width=999999) }}"
    dest: "{{ recyclarr_base_path }}/recyclarr.yml"
    mode: "0640"
    owner: "{{ recyclarr_uid }}"
    group: "{{ recyclarr_gid }}"
  register: recyclarr_config_file_result

- name: Ensure Recyclarr container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ recyclarr_container_image }}"
    pull: always
  register: recyclarr_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: recyclarr_container_image_pull_result_ansible_module is not failed

- name: Ensure Recyclarr container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ recyclarr_container_image }}"
  register: recyclarr_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: recyclarr_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in recyclarr_container_image_pull_result_command.stdout"

- name: Ensure Recyclarr container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ recyclarr_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: recyclarr_network_creation_result

- name: Ensure Recyclarr container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ recyclarr_container_network }}
  register: recyclarr_network_creation_result
  changed_when: recyclarr_network_creation_result.rc == 0
  failed_when: recyclarr_network_creation_result.rc != 0 and 'already exists' not in recyclarr_network_creation_result.stderr

- name: Ensure Recyclarr systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/recyclarr.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ recyclarr_identifier }}.service"
    mode: "0644"
    lstrip_blocks: true
  register: recyclarr_systemd_service_result

- name: Determine whether Recyclarr needs a restart
  ansible.builtin.set_fact:
    recyclarr_restart_necessary: >-
      {{
        recyclarr_support_files_result.changed | default(false)
        or recyclarr_config_file_result.changed | default(false)
        or recyclarr_systemd_service_result.changed | default(false)
        or recyclarr_container_image_pull_result_ansible_module.changed | default(false)
        or recyclarr_container_image_pull_result_command.changed | default(false)
      }}
