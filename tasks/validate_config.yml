---
- name: Fail if required Recyclarr settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - recyclarr_uid
    - recyclarr_gid
    - recyclarr_container_network

- name: Fail if no Sonarr or Radarr instance is configured for Recyclarr
  ansible.builtin.fail:
    msg: >-
      You need to configure at least one Sonarr or Radarr instance to sync,
      in `recyclarr_config_sonarr` or `recyclarr_config_radarr`.
  when: >-
    recyclarr_configuration.sonarr | default({}, true) | length == 0
    and recyclarr_configuration.radarr | default({}, true) | length == 0
