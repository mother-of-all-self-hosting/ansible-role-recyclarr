---
- name: Perform Recyclarr installation tasks
  when: recyclarr_enabled | bool
  tags:
    - setup-all
    - setup-recyclarr
    - install-all
    - install-recyclarr
  block:
    - name: Validate Recyclarr configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Recyclarr
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Recyclarr uninstallation tasks
  when: not recyclarr_enabled | bool
  tags:
    - setup-all
    - setup-recyclarr
  block:
    - name: Uninstall Recyclarr
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
